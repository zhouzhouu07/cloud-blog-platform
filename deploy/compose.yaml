name: cloud-blog

services:
  web:
    image: nginx:alpine
    container_name: cloud-blog-web
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ../web:/usr/share/nginx/html:ro,Z
      - ../config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro,Z

    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/health | grep -q ok
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - blog-network

networks:
  blog-network:
    name: cloud-blog-network
    driver: bridge
