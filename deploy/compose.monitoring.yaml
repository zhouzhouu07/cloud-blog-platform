services:
  prometheus:
    image: ${PROMETHEUS_IMAGE}
    container_name: cloud-blog-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=3d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ../config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - ../config/prometheus/rules:/etc/prometheus/rules:ro,Z
      - prometheus-data:/prometheus
    networks:
      - blog-network
    depends_on:
      - node-exporter
      - cadvisor
      - alertmanager
    mem_limit: 256m

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE}
    container_name: cloud-blog-node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    pid: host
    networks:
      - blog-network
    mem_limit: 96m

  cadvisor:
    image: ${CADVISOR_IMAGE}
    container_name: cloud-blog-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - blog-network
    mem_limit: 192m

  grafana:
    image: ${GRAFANA_IMAGE}
    container_name: cloud-blog-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Asia/Shanghai
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../config/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ../config/grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
    networks:
      - blog-network
    depends_on:
      - prometheus
    mem_limit: 256m

  alertmanager:
    image: ${ALERTMANAGER_IMAGE}
    container_name: cloud-blog-alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ../config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,Z
      - alertmanager-data:/alertmanager
    networks:
      - blog-network
    mem_limit: 128m

volumes:
  prometheus-data:
    name: cloud-blog-prometheus-data
  grafana-data:
    name: cloud-blog-grafana-data
  alertmanager-data:
    name: cloud-blog-alertmanager-data
