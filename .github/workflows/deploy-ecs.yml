name: Deploy to ECS

on:
  workflow_run:
    workflows:
      - Build API Image
      - Build Frontend Image
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Cloud Blog to ECS
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ECS_SSH_KEY }}" > ~/.ssh/cloud_blog_deploy_key
          chmod 600 ~/.ssh/cloud_blog_deploy_key
          ssh-keyscan -p "${{ secrets.ECS_SSH_PORT }}" -H "${{ secrets.ECS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on ECS
        run: |
          ssh \
            -i ~/.ssh/cloud_blog_deploy_key \
            -p "${{ secrets.ECS_SSH_PORT }}" \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}" \
            "/opt/cloud-blog/scripts/deploy_from_ci.sh"

      - name: Remote health check
        run: |
          ssh \
            -i ~/.ssh/cloud_blog_deploy_key \
            -p "${{ secrets.ECS_SSH_PORT }}" \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}" \
            "curl -fsS http://127.0.0.1/api/version && echo && curl -fsSI http://127.0.0.1"
