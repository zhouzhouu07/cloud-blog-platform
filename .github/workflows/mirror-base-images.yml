name: Mirror Base Images to ACR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror-images:
    name: Mirror MariaDB and Nginx
    runs-on: ubuntu-latest

    steps:
      - name: Log in to Alibaba Cloud ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Mirror MariaDB image
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_IMAGE="mariadb:lts"
          TARGET_IMAGE="${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/cloud-blog-mariadb"

          docker pull "${SOURCE_IMAGE}"

          docker tag "${SOURCE_IMAGE}" "${TARGET_IMAGE}:lts"
          docker tag "${SOURCE_IMAGE}" "${TARGET_IMAGE}:lts-20260731"

          docker push "${TARGET_IMAGE}:lts"
          docker push "${TARGET_IMAGE}:lts-20260731"

      - name: Mirror Nginx image
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_IMAGE="nginx:alpine"
          TARGET_IMAGE="${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/cloud-blog-nginx"

          docker pull "${SOURCE_IMAGE}"

          docker tag "${SOURCE_IMAGE}" "${TARGET_IMAGE}:alpine"
          docker tag "${SOURCE_IMAGE}" "${TARGET_IMAGE}:alpine-20260731"

          docker push "${TARGET_IMAGE}:alpine"
          docker push "${TARGET_IMAGE}:alpine-20260731"
